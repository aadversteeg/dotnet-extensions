name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for GitVersion
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Restore dependencies
        run: dotnet restore src/extensions-filesystem.sln
      
      - name: Build
        run: dotnet build src/extensions-filesystem.sln --no-restore --configuration Release /p:Version=${{ steps.get_version.outputs.VERSION }}
      
      - name: Test
        run: dotnet test src/extensions-filesystem.sln --no-build --configuration Release --verbosity normal
      
      - name: Pack
        run: dotnet pack src/extensions-filesystem.sln --no-build --configuration Release /p:Version=${{ steps.get_version.outputs.VERSION }} --output ./packages
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
      
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./packages/*.nupkg"
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Extensions.FileSystem v${{ steps.get_version.outputs.VERSION }}"
          body: |
            # Extensions.FileSystem v${{ steps.get_version.outputs.VERSION }}
            
            Cross-platform file system operations for .NET applications.
            
            ## Packages included in this release:
            
            - Ave.Extensions.FileSystem.Abstractions v${{ steps.get_version.outputs.VERSION }}
            - Ave.Extensions.FileSystem v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          generateReleaseNotes: true
