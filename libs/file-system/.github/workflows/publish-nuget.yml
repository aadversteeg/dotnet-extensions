name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.0.1-preview.1)'
        required: true
        type: string
      release_id:
        description: 'GitHub Release ID to use for package files'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          releaseId: ${{ github.event.inputs.release_id }}
          fileName: "*.nupkg"
          out-file-path: "./packages"
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Push to NuGet
        run: |
          dotnet nuget push "./packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
