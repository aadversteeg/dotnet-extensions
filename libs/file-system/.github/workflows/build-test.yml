name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      
      - name: Restore dependencies
        run: dotnet restore src/extensions-filesystem.sln
      
      - name: Build
        run: dotnet build src/extensions-filesystem.sln --no-restore --configuration Release
      
      - name: Test
        run: dotnet test src/extensions-filesystem.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests.AzureFileStorage"
