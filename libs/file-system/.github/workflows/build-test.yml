name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']
    env:
      AZURE_CONFIGURED: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore src/extensions-filesystem.sln

      - name: Build
        run: dotnet build src/extensions-filesystem.sln --no-restore --configuration Release

      - name: Test (Unit and Local Integration)
        run: dotnet test src/extensions-filesystem.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests.Extensions.FileSystem.AzureFileStorage"

      - name: Test (Azure Integration)
        if: env.AZURE_CONFIGURED != ''
        env:
          AZURE_FILESTORAGE_AzureFileStorage__AccountName: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_FILESTORAGE_AzureFileStorage__AccountKey: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: dotnet test src/IntegrationTests.AzureFileStorage --no-build --configuration Release --verbosity normal
