<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Generated text inside a link and inside a span group at 10.5 pt: a link with a ::before, a link with an ::after, a span with a language and a ::before. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } a.n::before { content: "see "; } a.m::after { content: " more"; } .r::before { content: "from "; }</style></head><body>
<p>Link <a class="n" href="https://example.com/n">page</a> end</p>
<p>Link <a class="m" href="https://example.com/m">page</a> end</p>
<p>Span <span lang="nl" class="r">tekst</span> end</p>
</body></html>
