<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Links inside a raised element at 10.5 pt: a footnote mark to an anchor further down, a mark to a URI, a raised link of two words, and a link around text that holds no raised element. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } </style></head><body>
<p>Note one<sup><a href="#footnote">1</a></sup> and two<sup><a href="https://example.com/two">2</a></sup> end.</p>
<p>Plain <a href="https://example.com/plain">link text</a> here.</p>
<p>Wide <sup><a href="https://example.com/wide">raised link</a></sup> end.</p>
<p style="margin-top: 60pt" id="footnote">Footnote one is here.</p>
</body></html>
