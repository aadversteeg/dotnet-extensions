<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 300pt; margin: 12pt; }
span { display: inline-block; background-color: #a0e0a0; }
</style></head><body>
<!-- Margins on an inline-block: on all four sides and on one side each. -->
<p>Above the margins.</p>
<p>All <span style="margin: 6pt 9pt">Four</span> sides.</p>
<p>Top <span style="margin-top: 7.5pt">High</span> only.</p>
<p>Bottom <span style="margin-bottom: 7.5pt">Low</span> only.</p>
<p>Left <span style="margin-left: 12.3pt">Pushed</span> only.</p>
<p>Below the margins.</p>
</body></html>
