<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 220pt; margin: 12pt; }
</style></head><body>
<!-- Empty inline-blocks: a coloured square with a width and a height, one with only a border, one with only padding, used as a legend swatch or a drawn checkbox. -->
<p>Red <span style="display: inline-block; width: 7.5pt; height: 7.5pt; background-color: #ff0000"></span> square.</p>
<p>Box <span style="display: inline-block; width: 6pt; height: 6pt; border: 0.75pt solid #000000"></span> drawn.</p>
<p>Pad <span style="display: inline-block; padding: 0 6pt; background-color: #00a000"></span> only.</p>
<p>Swatches <span style="display: inline-block; width: 9pt; height: 9pt; background-color: #0000ff; margin-right: 3pt"></span>blue <span style="display: inline-block; width: 9pt; height: 9pt; background-color: #ffa000; margin-right: 3pt"></span>orange</p>
<p>Last line of text.</p>
</body></html>
