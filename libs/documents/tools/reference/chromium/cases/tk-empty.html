<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">

<style>@page { size: 300pt 500pt; margin: 12pt; } body { font-size: 10.5pt; } .s { border-collapse: separate; border-spacing: 3pt; border: 1.5pt solid #ff0000; padding: 1.5pt; } td, th { border-color: #0000ff; }
.t { background: #eeeeee; } .g { background: #ccffcc; } .c { background: #ccccff; } .b { background: #ffffcc; } .r { background: #ffcccc; } .d { background: #ccffff; }</style></head><body>
<table id="a">
<tr class="r"><td id="one-a">one</td><td></td></tr>

</table>

</table>

<table id="c" class="s" style="empty-cells: hide">
