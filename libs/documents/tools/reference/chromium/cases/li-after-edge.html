<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@page { size: 300pt 400pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
ul, ol { margin: 0; }
table { width: 100%; border-collapse: collapse; }
td { padding: 2.3pt 3.7pt; border: 0.75pt solid #000; }
</style></head><body>
<!-- Lists whose content edge lies between pixels, in a cell and with padding in points, and items with a line height in points. -->
<p id="Start" style="line-height: 13pt">Start of the page</p>
<ul style="padding-left: 20pt"><li>Twenty points in</li><li style="line-height: 13pt">Thirteen high</li></ul>
<ul style="padding-left: 20.4pt; list-style-type: circle"><li style="line-height: 15pt">Circle fifteen</li><li style="line-height: 11.6pt">Circle eleven</li></ul>
<ol style="padding-left: 20.4pt"><li style="line-height: 13pt">Ordered thirteen</li></ol>
<table id="Outer"><tr><td><ul style="padding-left: 19.6pt"><li>Inner one</li><li style="line-height: 13pt">Inner two</li></ul></td></tr></table>
<ul style="padding-left: 20pt; list-style-type: square"><li style="line-height: 13pt">Square thirteen</li><li style="line-height: 13pt">Square again</li></ul>
<ul style="padding-left: 20pt; font-size: 12pt"><li style="line-height: 15.3pt">Big disc</li></ul>
</body></html>
