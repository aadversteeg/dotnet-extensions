<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- A row of height 70pt with cells aligned middle and bottom that does not fit at the end of the page, collapsed, below a header that repeats. -->
<style>@page { size: 300pt 200pt; margin: 12pt; } body { font-size: 10.5pt; } .s { border-collapse: separate; border-spacing: 3pt; border: 1.5pt solid #ff0000; padding: 1.5pt; } td, th { border-color: #0000ff; }</style></head><body>
<p id="first" style="padding-top: 90pt">first</p>
<table id="a">
<thead><tr><th id="head-a">head</th><th>two</th></tr>
</thead>
<tbody>
<tr style="height: 70pt"><td id="one-a" style="vertical-align: middle">one</td><td style="vertical-align: bottom">two</td></tr>
</tbody>
</table>
<p>after</p>
</body></html>
