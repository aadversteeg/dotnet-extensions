<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Italic.ttf); font-weight: 400; font-style: italic; }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 6pt 0; }
.m::before { content: "Before block"; display: block; margin: 9pt 0 3pt; }
.m::after { content: "After block"; display: block; margin: 12pt 0 0; }
.f { padding: 3pt 0; border-top: 0.75pt solid #000000; border-bottom: 0.75pt solid #000000; }
.f::before { content: "Framed before"; display: block; margin: 4.5pt 0; }
.f::after { content: "Framed after"; display: block; margin: 4.5pt 0; }
</style></head><body>
<p id="leading">Leading paragraph</p>
<p class="m" id="before">Middle text</p>
<p id="following">Following paragraph</p>
<p class="f" id="framed">Framed text</p>
<p id="closing">Closing paragraph</p>
</body></html>
