<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- A paragraph whose bottom padding does not fit below its line, then a second paragraph, in a bordered box: on the first
     page the box ends right below the line; on the second the padding fits, the box breaks between the two paragraphs
     and fills the page. -->
<style>@page { size: 300pt 60pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; orphans: 1; widows: 1; }</style></head><body>
<div style="border:1.5pt solid #0000ff"><p style="padding-bottom:30pt">a</p><p>b</p></div><p>after</p>
</body></html>
