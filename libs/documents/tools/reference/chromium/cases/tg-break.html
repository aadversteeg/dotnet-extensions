<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Tall rows at a page break: a, a row of height 60pt that does not fit at the end of the page; b, a row of height 250pt, taller than the page. -->
<style>@page { size: 300pt 200pt; margin: 12pt; } body { font-size: 10.5pt; } .s { border-collapse: separate; border-spacing: 3pt; border: 1.5pt solid #ff0000; padding: 1.5pt; } td, th { border-color: #0000ff; }</style></head><body>
<p id="first" style="padding-top: 120pt">first</p>
<table id="a">
<tr style="height: 60pt"><td id="one-a">one</td><td>two</td></tr>
</table>
<p>next 1</p>
<table id="b">
<tr style="height: 250pt"><td id="one-b">one</td><td>two</td></tr>
</table>
<p>after</p>
</body></html>
