<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- One dashed side beside solid sides of the same colour, one dashed side alone, two dashed sides that meet in a corner, and a dashed border over a background. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } div { width: 120px; height: 24px; padding: 2px 6px; margin-bottom: 8px; }</style></head><body>
<p>Mixed sides.</p>
<div id="Top" style="border: 2px solid #2060a0; border-top-style: dashed">Top dashed, others solid</div>
<div id="Left" style="border-left: 3px dashed #c03020">Left dashed alone</div>
<div id="Corner" style="border-top: 2px dashed #208040; border-left: 2px dashed #208040">Corner of two</div>
<div id="Filled" style="border: 2px dashed #c03020; background: #f0e0a0">Filled under dashes</div>
<div id="Thin" style="border: 1px dashed #303030; background: #e0f0d0">Thin over a fill</div>
</body></html>
