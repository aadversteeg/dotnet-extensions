<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; font-style: normal; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; font-style: normal; }
html, body { margin: 0; font-family: Lato; font-size: 10pt; }
@page { size: 400pt 300pt; margin: 60pt 50pt; font-family: Lato; font-size: 10pt;
  @top-left { content: "Aaaa"; background-color: #ff0000; }
  @top-right { content: "Bbbbbbbbbbbbbbbb Bbbbbbbbbbbbbbbb Bbbbbbbbbbbbbbbb"; background-color: #00ff00; }
  @bottom-left { content: "L"; background-color: #ff0000; }
  @bottom-center { content: "Centre text"; background-color: #0000ff; }
  @bottom-right { content: "Right side text that is longer"; background-color: #00ff00; }
}
@page :first {
  @top-left { content: "Cccc"; }
  @top-right { content: "Dd"; }
  @bottom-center { content: "Wide centre text that takes much more room than the sides"; }
}
@page :first { @top-left { content: "Eeeeeee Eeeeeee"; } }
</style></head>
<body><p>one</p><p style="break-before: page">two</p></body></html>
