<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0 0 6pt; }

<p class="g" id="Mark">own &#x2714; text</p>
<p id="after">After</p>
