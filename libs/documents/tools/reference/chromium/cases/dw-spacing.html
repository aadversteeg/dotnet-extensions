<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Underlined letter-spaced text, at 10.5 pt with letter-spacing 0.75pt (1 px): the exact end with the spacing after the last letter lies just below a half pixel, and so does the end without it, so either reading shows in whole pixels. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; text-decoration-skip-ink: none; } .u { text-decoration: underline; } .ls { letter-spacing: 0.75pt; }</style></head><body>
<p>x <span class="u ls">0n</span></p>
<p>x0 <span class="u ls">n</span></p>
<p>x <span class="u ls">xa</span> n</p>
</body></html>
