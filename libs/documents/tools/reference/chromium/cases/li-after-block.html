<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@page { size: 300pt 400pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 24pt; }
div { border: 0.8pt solid #000; padding: 2.2pt 4pt; }
img { display: block; }
</style></head><body>
<!-- A list right after a block of a height in points that ends between pixels: a paragraph with a line height in points, a box with a border and padding in points, an image. -->
<p id="Thirteen" style="line-height: 13pt">Thirteen points high</p>
<ul><li>Disc one</li><li>Disc two</li></ul>
<div id="Boxed">Boxed text</div>
<ul style="list-style-type: circle"><li>Circle one</li></ul>
<p id="Before" style="line-height: 13pt">Before the image</p>
<img src="figure.png">
<ul style="list-style-type: square"><li>Square one</li></ul>
<p id="Twelve" style="line-height: 12.4pt">Twelve and a bit</p>
<ol><li>Number one</li><li>Number two</li></ol>
<p id="Eleven" style="line-height: 11.6pt">Eleven and a bit</p>
<ul><li>Last one</li></ul>
</body></html>
