<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 400pt; margin: 12pt; }
span { display: inline-block; width: 40pt; background-color: #ffe0a0; }
table { border-collapse: collapse; }
td { border: 0.75pt solid #000000; padding: 1.5pt 3pt; }
</style></head><body>
<!-- An inline-block with a negative left and top margin in a line of text (the line that iblk-align held). -->
<p>Minus <span style="background-color: #a0e0a0; margin-left: -3pt; margin-top: -3pt">Pulled</span> in.</p>
</body></html>
