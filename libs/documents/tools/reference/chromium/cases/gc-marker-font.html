<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Italic.ttf); font-weight: 400; font-style: italic; }
@font-face { font-family: Theano; src: url(../../../../assets/fonts/theano/TheanoDidot-Regular.ttf); }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
ul, ol { margin: 0 0 6pt; }
li { background: #eeeeee; }
.w li::marker { font-weight: bold; }
.i li::marker { font-style: italic; }
.s li::marker { font-size: 16pt; }
.t li::marker { font-family: Theano; }
</style></head><body>
<ol class="w"><li>Weight</li><li>Weight</li></ol>
<ol class="i"><li>Italic</li></ol>
<ol class="s" start="9"><li>Size</li><li>Size</li></ol>
<ol class="t"><li>Theano</li></ol>
<ul class="s"><li>Bullet</li></ul>
<ul class="t"><li>Didot</li></ul>
</body></html>
