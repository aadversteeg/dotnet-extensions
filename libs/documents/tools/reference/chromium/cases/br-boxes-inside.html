<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">

<p>top</p>
<table><tr><td style="width:100pt"><div id="cell" class="r">cell</div></td><td style="width:100pt"><div id="square">square</div></td></tr></table>
<ul><li><div id="item" class="r">item</div></li><li><div id="plain">plain</div></li></ul>
<p>end</p>
</body></html>
