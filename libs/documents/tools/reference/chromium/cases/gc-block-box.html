<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Italic.ttf); font-weight: 400; font-style: italic; }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0 0 6pt; }
h2 { font-size: 14pt; margin: 9pt 0 6pt; counter-increment: sec; }
.b { margin: 0 0 6pt; }
.b::before { content: "Boxed heading"; display: block; padding: 3pt 6pt; border: 1.5pt solid #336699; background: #e0e8f0; text-align: center; color: #003366; }
.b::after { content: "Right aside"; display: block; text-align: right; background-color: #f0e0e0; }
h2::before { content: "Section " counter(sec) "."; display: block; font-size: 10.5pt; color: #666666; }
h2::after { content: ""; display: block; border-bottom: 0.75pt solid #993333; }
</style></head><body>
<p class="b" id="boxed">Body of the box</p>
<h2 id="section">Results</h2>
<p id="plain">Plain text under it</p>
<h2>Method</h2>
<p>Closing words</p>
</body></html>
