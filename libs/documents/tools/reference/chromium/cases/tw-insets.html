<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Tables of width 100% in a 300pt (400px) container, cells with unequal padding and borders, automatic layout, 10.5pt.
     Paddings and borders are whole pixels (multiples of 0.75pt). -->
<style>body { font-size: 10.5pt; } table { width: 100%; }</style></head><body>
<div id="w-pad" style="width:300pt"><table id="pad"><tr><td style="padding:1.5pt 9pt">short</td><td style="padding:1.5pt 3pt">a longer text</td></tr></table></div>
<div id="w-border" style="width:300pt"><table id="border"><tr><td style="border-left:3pt solid #000">short</td><td style="border-right:6pt solid #000">a longer text</td><td>mid</td></tr></table></div>
</body></html>
