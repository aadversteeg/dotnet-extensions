<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Tables of width 100% in a 300pt (400px) container with col lengths, automatic layout, 10.5pt. -->
<style>body { font-size: 10.5pt; } table { width: 100%; }</style></head><body>
<div id="w-col-auto" style="width:300pt"><table id="col-auto"><colgroup><col style="width:60pt"><col><col></colgroup><tr><td>fixed</td><td>short</td><td>a longer text</td></tr></table></div>
<div id="w-col-all" style="width:300pt"><table id="col-all"><colgroup><col style="width:60pt"><col style="width:90pt"></colgroup><tr><td>short</td><td>a longer text</td></tr></table></div>
<div id="w-col-all-three" style="width:300pt"><table id="col-all-three"><colgroup><col style="width:45pt"><col style="width:60pt"><col style="width:75pt"></colgroup><tr><td>a</td><td>b</td><td>c</td></tr></table></div>
<div id="w-col-narrow" style="width:300pt"><table id="col-narrow"><colgroup><col style="width:30pt"><col></colgroup><tr><td>Supercalifragilistic</td><td>short</td></tr></table></div>
<div id="w-col-narrow-auto" style="width:300pt"><table id="col-narrow-auto" style="width:auto"><colgroup><col style="width:30pt"><col></colgroup><tr><td>Supercalifragilistic</td><td>short</td></tr></table></div>
<div id="w-col-wide-content" style="width:300pt"><table id="col-wide-content"><colgroup><col style="width:30pt"><col style="width:60pt"></colgroup><tr><td>one two three four</td><td>short</td></tr></table></div>
</body></html>
