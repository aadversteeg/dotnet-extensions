<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Amounts in right-aligned table cells, as an invoice sets them (Lato 10.5 pt and 11 pt): with the default figures, with proportional-nums and with tabular-nums; the digits line up under each other with tabular figures (Lato's default), and not with proportional ones. -->
<style>@page { size: 300pt 480pt; margin: 12pt; } body { line-height: 18pt; } td { text-align: right; } .t { font-variant-numeric: tabular-nums; } .p { font-variant-numeric: proportional-nums; } .a { font-size: 10.5pt; } .b { font-size: 11pt; }</style></head><body>
<table class="a"><tr><td>Amount</td><td class="p">Amount</td><td class="t">Amount</td></tr><tr><td>1,111.11</td><td class="p">1,111.11</td><td class="t">1,111.11</td></tr><tr><td>800.00</td><td class="p">800.00</td><td class="t">800.00</td></tr><tr><td>97.40</td><td class="p">97.40</td><td class="t">97.40</td></tr></table>
<table class="b"><tr><td>Amount</td><td class="p">Amount</td><td class="t">Amount</td></tr><tr><td>1,111.11</td><td class="p">1,111.11</td><td class="t">1,111.11</td></tr><tr><td>800.00</td><td class="p">800.00</td><td class="t">800.00</td></tr><tr><td>97.40</td><td class="p">97.40</td><td class="t">97.40</td></tr></table>
</body></html>
