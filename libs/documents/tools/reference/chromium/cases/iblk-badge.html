<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 220pt; margin: 12pt; }
.b { display: inline-block; padding: 3pt 6pt; border: 1.5pt solid #0000ff; background-color: #ff0000; }
</style></head><body>
<!-- An inline-block with padding, a border and a background holding one line of text, in a line of text: its width shrinks to its text, its text sits on the line's baseline, and its margin box sets the line's height above and below the baseline. -->
<p>Before <span class="b">Badge</span> after.</p>
<p>Next line below it.</p>
<p>Tall <span style="display: inline-block; padding: 6pt 3pt; border: 0.75pt solid #000000; background-color: #ffff00; font-size: 16pt">Large</span> words.</p>
<p>Small <span style="display: inline-block; padding: 1.5pt; background-color: #c0c0ff; font-size: 7pt">tiny</span> text.</p>
<p>Spaced <span style="display: inline-block; background-color: #c0ffc0; line-height: 24pt">Lines</span> here.</p>
<p>Bold <span style="display: inline-block; background-color: #ffc0ff; font-weight: 700; padding: 0 2.3pt">Strong</span> and <span style="display: inline-block; background-color: #c0ffff">plain</span> end.</p>
<p>Last line of text.</p>
</body></html>
