<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Raised and lowered text in a table cell that a page break cuts, at 10.5 pt: lines with a sup and a sub on both pages. -->
<style>@page { size: 200pt 150pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; }</style></head><body>
<p>First paragraph</p>
<p>Second paragraph</p>
<p>Third paragraph</p>
<table><tr><td id="line">Line one x<sup>2</sup><br>Line two<br>Line three y<sub>3</sub><br>Line four<br>Line five z<sup>4</sup><br>Line six<br>Line seven w<sub>5</sub></td><td>two</td></tr></table>
<p>After</p>
</body></html>
