<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Different radii per corner: four, three and two values of the shorthand, and two longhands. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { background: #c06020; color: #ffffff; width: 150px; height: 40px; padding: 2px 6px; margin-bottom: 8px; }</style></head><body>
<p>top</p>
<div id="four" style="border-radius:4px 8px 12px 16px">four</div>
<div id="three" style="border-radius:5px 10px 15px">three</div>
<div id="two" style="border-radius:6px 20px">two</div>
<div id="longhands" style="border-top-left-radius:10px;border-bottom-right-radius:25px">longhands</div>
<p>end</p>
</body></html>
