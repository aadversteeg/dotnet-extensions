<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Italic.ttf); font-weight: 400; font-style: italic; }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p, div { margin: 0 0 4pt; }
.a h4 { counter-increment: un; margin: 0 0 4pt; font-size: 10.5pt; } .a h4::after { content: " " counter(un); }
.b p::after { content: " " counter(q); } .b p.inc { counter-increment: q; }
.c p { counter-increment: w; } .c p::after { content: " " counter(w); }
.d p.make::after { counter-increment: v; content: " " counter(v); } .d p.read::after { content: " " counter(v); }
.e p { counter-increment: t; } .e p::after { content: " " counter(t); }
</style></head><body>
<div class="a"><div><h4>Inside</h4></div><h4>Beside</h4><div><h4>Later</h4></div></div>
<div class="b"><p>Read</p><p class="inc">Increment</p><p>Again</p></div>
<div class="c"><div><div><p>Deep</p></div></div><p>Shallow</p></div>
<div class="d"><p class="make">Made</p><p class="read">Gone</p></div>
<div class="e"><p>First</p><div><p>Nested</p></div><p>Third</p></div>
</body></html>
