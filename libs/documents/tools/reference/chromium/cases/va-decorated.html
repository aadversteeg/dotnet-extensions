<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Shifted text with decorations, colour, a link, and across line breaks, at 10.5 pt, line height 18pt: an underline and a line-through on the sup and sub themselves, a coloured sup, a link inside a sup, a shifted span that starts a line and one that wraps over two lines. -->
<style>@page { size: 300pt 480pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 18pt; text-decoration-skip-ink: none; } .u { text-decoration: underline; } .s { text-decoration: line-through; } .r { color: #c00; } .up { vertical-align: super; } .w { margin-right: 186pt; }</style></head><body>
<p>Word x<sup class="u">2</sup> y H<sub class="s">2</sub>O z</p>
<p>Word x<sup class="r">2</sup> y e<sup><a href="https://example.com/">3</a></sup> z</p>
<p class="w">Word word word word <span class="up">high</span> low</p>
<p class="w">Word low <span class="up">high high high high</span> low</p>
</body></html>
