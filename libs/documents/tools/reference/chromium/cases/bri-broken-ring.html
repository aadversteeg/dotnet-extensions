<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- A rounded inline box with a border broken over two lines: Chromium draws each part of the border under clipping paths. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } div { width: 140px; margin-bottom: 8pt; } .bg { background: #f0e0a0; } .r { border-radius: 8px; padding: 1px 5px; } .one { border: 1px solid #c03020; }</style></head><body>
<div>Ring <span class="bg r one">lines of a rounded box here</span> end.</div>
</body></html>
