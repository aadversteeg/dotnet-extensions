<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Dashed borders of 1, 2, 3 and 4 px on all four sides of a box: the dashes along each side and in the corners. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } div { width: 100px; height: 30px; margin-bottom: 8px; color: #303030; }</style></head><body>
<p>Dashed boxes.</p>
<div id="One" style="border: 1px dashed #c03020">One</div>
<div id="Two" style="border: 2px dashed #2060a0">Two</div>
<div id="Three" style="border: 3px dashed #208040">Three</div>
<div id="Four" style="border: 4px dashed #806020">Four</div>
</body></html>
