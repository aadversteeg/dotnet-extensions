<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Inset and outset borders on only some sides: top and bottom, left only, top and left, bottom and right. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { padding: 3pt; margin-bottom: 6pt; }</style></head><body>
<p>top</p>
<div id="tb" style="border-top:3px inset;border-bottom:3px inset">tb</div>
<div id="lo" style="border-left:3px inset">lo</div>
<div id="tl" style="border-top:3px outset;border-left:3px outset">tl</div>
<div id="br" style="border-bottom:3px inset;border-right:3px inset">br</div>
<p>end</p>
</body></html>
