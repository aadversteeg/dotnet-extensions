<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; font-style: normal; }
html, body { margin: 0; font-family: Lato; font-size: 10pt; }
@page { size: 400pt 300pt; margin: 60pt 50pt; font-family: Lato; font-size: 10pt;
  @top-left { content: "Report"; }
  @bottom-left { content: "Printed"; border-top: 3pt solid #0000ff; padding-top: 6pt; }
  @bottom-right { content: "Page " counter(page) " of " counter(pages); border-top: 3pt solid #0000ff; padding-top: 6pt; }
}
</style></head>
<body><p>one</p><p style="break-before: page">two</p><p style="break-before: page">three</p></body></html>
