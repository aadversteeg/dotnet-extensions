<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Rounded inline boxes with a background broken over two and three lines: the first part has the left corners, the last the right ones, a part between them none. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } div { width: 140px; margin-bottom: 8pt; } .bg { background: #f0e0a0; } .r { border-radius: 8px; padding: 1px 5px; }</style></head><body>
<div>Two <span class="bg r">lines of a rounded box here</span> end.</div>
<div>Three <span class="bg r">lines of a longer rounded box going on and on over</span> end.</div>
</body></html>
