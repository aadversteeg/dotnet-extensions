<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@page { size: 300pt 400pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
table { width: 100%; border-collapse: collapse; }
table.separate { border-collapse: separate; border-spacing: 1.5pt; }
td { padding: 2.3pt 4pt; border: 0.75pt solid #000; }
ul, ol { margin: 0; padding-left: 24pt; }
</style></head><body>
<!-- A list right after a table: collapsed and separated, with cell padding in points, so the list starts between pixels. -->
<table id="Alpha"><tr><td>Alpha cell</td></tr></table>
<ul><li>Disc one</li><li>Disc two</li></ul>
<table class="separate" id="Beta"><tr><td>Beta cell</td></tr></table>
<ul style="list-style-type: circle"><li>Circle one</li><li>Circle two</li></ul>
<table id="Gamma"><tr><td style="padding-top: 1.7pt">Gamma cell</td></tr></table>
<ul style="list-style-type: square"><li>Square one</li></ul>
<table class="separate" id="Delta"><tr><td style="padding-bottom: 3.1pt">Delta cell</td></tr></table>
<ol><li>Number one</li><li>Number two</li></ol>
</body></html>
