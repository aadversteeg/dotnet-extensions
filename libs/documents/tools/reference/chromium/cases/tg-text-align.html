<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">

<p id="first" style="padding-top: 140pt">first</p>
<table id="a">
<tr style="height: 70pt"><td id="one-a" style="vertical-align: middle">one<br>more</td><td style="vertical-align: middle">two</td><td style="vertical-align: bottom">three</td></tr>
</table>
<p>after</p>
</body></html>
