<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- The fixed table layout at width 100% with three columns without a width in a 276pt (368px) page area: each column
     gets an even share, and the first column holds a word wider than its share, which cannot break (the cell beside
     it is empty, so the word overflows into no text). -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } table { width: 100%; table-layout: fixed; }</style></head><body>
<table id="wide"><tbody><tr><td>Pneumonoultramicroscopic</td><td></td><td>c</td></tr>
<tr><td>a</td><td>two words</td><td>three</td></tr>
</tbody></table>
</body></html>
