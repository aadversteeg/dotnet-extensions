<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Captions over tables with percent column widths at 10.5 pt: a full-width table of 30% and 70% columns, and an 80% table of 25%, 25% and an auto column under a caption that wraps. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } table { margin-bottom: 6pt; }</style></head><body>
<table style="width: 100%"><caption id="caption">Caption text</caption><tr><td id="one" style="width: 30%">one</td><td style="width: 70%">two</td></tr></table>
<table style="width: 80%"><caption>Second caption that wraps over two lines in this table</caption><tr><td id="a" style="width: 25%">a</td><td style="width: 25%">b</td><td>c</td></tr></table>
</body></html>
