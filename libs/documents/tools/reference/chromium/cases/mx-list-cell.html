<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- An inline box and a link in a list item, in a table cell with a height and in a caption, at 10.5 pt. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } ul { margin: 0 0 6pt 0; padding-left: 18pt; } .y { background-color: #ffd700; padding: 1pt 2pt; } table { margin-bottom: 6pt; }</style></head><body>
<ul><li>Item <span class="y">box</span> and <a href="https://example.com/item">link</a> end</li></ul>
<table><tr><td id="Cell" style="height: 40pt">Cell <span class="y">box</span> and <a href="https://example.com/cell">link</a></td><td>two</td></tr></table>
<table><caption id="caption">Caption <span class="y">box</span> and <a href="https://example.com/caption">link</a></caption><tr><td>one</td></tr></table>
</body></html>
