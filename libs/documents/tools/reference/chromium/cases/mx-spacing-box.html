<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- letter-spacing across the edges of an inline box at 10.5 pt: a spaced paragraph with a box inside a word and around a word, a spaced box in plain text, and a spaced box that starts inside a word. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } .w { letter-spacing: 1pt; } .y { background-color: #ffd700; padding: 0 2pt; }</style></head><body>
<p class="w">Spaced wo<span class="y">rd</span> and <span class="y">box</span> end</p>
<p>Plain <span class="y w">box</span> after</p>
<p>Plain wo<span class="w y">rd</span>s end</p>
</body></html>
