<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Radii in percent: 50% on a square is a circle, 50% and 30% on a rectangle are ellipses (percent of the width across, of the height down). -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { background: #a04080; color: #ffffff; margin-bottom: 8px; }</style></head><body>
<p>top</p>
<div id="circle" style="border-radius:50%;width:60px;height:60px">circle</div>
<div id="ellipse" style="border-radius:50%;width:150px;height:40px">ellipse</div>
<div id="thirty" style="border-radius:30%;width:150px;height:40px">thirty</div>
<p>end</p>
</body></html>
