<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Separated borders, a break inside a row whose cells keep the user agent's alignment (middle) but one at the bottom: a cell of ten lines cut beside a cell of one line at the bottom and one of three lines. -->
<style>@page { size: 300pt 160pt; margin: 12pt; } body { font-size: 10.5pt; } table { border-collapse: separate; border-spacing: 6pt; border: 3pt solid #ff0000; padding: 3pt; background: #ffff00; } td, th { border-color: #0000ff; vertical-align: inherit; }</style></head><body>
<table id="t">
<tr><td id="one-cell">one</td><td>text 1</td><td>more 1</td></tr>
<tr><td id="long-cell">long<br>line 2<br>line 3<br>line 4<br>line 5<br>line 6<br>line 7<br>line 8<br>line 9<br>line 10</td><td id="short-cell" style="vertical-align: bottom">short</td><td id="mid-cell">mid<br>mid 2<br>mid 3</td></tr>
<tr><td id="three-cell">three</td><td>text 3</td><td>more 3</td></tr>
</table>
<p>after</p>
</body></html>
