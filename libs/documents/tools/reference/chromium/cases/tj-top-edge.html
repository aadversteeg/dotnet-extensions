<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Collapsed borders, three columns, 1.5 pt black lines; the middle cells have a 3 pt top (b0, blue) and bottom (b1, orange) border, the outer cells 2.25 pt outer side borders (a0 red, c0 green, a1 magenta, c1 cyan): where a vertical line that is wider than the line it meets starts and ends at the table's top and bottom corners when a wider line elsewhere sets the table's top and bottom border. -->
<style>@page { size: 300pt 204pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { margin: 0 52pt 0 24pt; } table { width: 100%; table-layout: fixed; } td { border-width: 1.5pt; }</style></head><body>
<div><table id="t"><tbody>
<tr><td style="border-left: 2.25pt solid #ff0000">a0</td><td style="border-top: 3pt solid #0000ff">b0</td><td style="border-right: 2.25pt solid #008000">c0</td></tr>
<tr><td style="border-left: 2.25pt solid #ff00ff">a1</td><td style="border-bottom: 3pt solid #ff8000">b1</td><td style="border-right: 2.25pt solid #00ffff">c1</td></tr>
</tbody></table></div><p>below</p>
</body></html>
