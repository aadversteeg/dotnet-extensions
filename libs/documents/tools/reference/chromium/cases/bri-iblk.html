<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Rounded inline-blocks as the badges of invoices, minutes and product sheets write them: 3 px with a background, 8 px with a background and no vertical padding, 4 px with a 2 px border and no background; and one with a 1 px border and a background. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } .badge { display: inline-block; padding: 1mm 3mm; border-radius: 3px; background: #fde9c8; color: #8a5a00; font-weight: 700; } .status { display: inline-block; padding: 0 2mm; border-radius: 8px; background: #fff3e0; font-weight: 700; } .price { display: inline-block; font-weight: 700; padding: 2mm 5mm; border: 2px solid #2060a0; border-radius: 4px; } .ring { display: inline-block; padding: 1px 6px; border: 1px solid #c03020; border-radius: 6px; background: #f0e0a0; }</style></head><body>
<p>Invoice <span class="badge">Awaiting payment</span> end.</p>
<p>Minutes <span class="status">Open</span> and <span class="status">Done</span> end.</p>
<p>Price <span class="price">64.95 total</span> end.</p>
<p>Ring <span class="ring">badge</span> end.</p>
</body></html>
