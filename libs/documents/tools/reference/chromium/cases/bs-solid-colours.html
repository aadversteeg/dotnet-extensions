<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Solid borders of four colours (top red, right green, bottom blue, left orange) at 1, 3 and 8 px, and at 3 px on a box whose edges are off the whole pixel: where the sides meet at the corners. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { padding: 3pt; margin-bottom: 6pt; }</style></head><body>
<p>top</p>
<div id="c1" style="border:1px solid;border-color:#ff0000 #008000 #0000ff #ffa500">c1</div>
<div id="c3" style="border:3px solid;border-color:#ff0000 #008000 #0000ff #ffa500">c3</div>
<div id="c8" style="border:8px solid;border-color:#ff0000 #008000 #0000ff #ffa500">c8</div>
<div id="cx" style="border:3px solid;border-color:#ff0000 #008000 #0000ff #ffa500;padding:3.2pt;margin-left:0.4pt">cx</div>
<p>end</p>
</body></html>
