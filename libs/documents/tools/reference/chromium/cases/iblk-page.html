<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 100pt; margin: 12pt; }
span { display: inline-block; background-color: #ffc0c0; }
</style></head><body>
<!-- An inline-block that does not fit in what is left of the page: its line moves to the next page whole. -->
<p>Line one<br>Line two<br>Line three <span style="width: 45pt">one two three four five six seven</span> end.</p>
<p>After the box.</p>
</body></html>
