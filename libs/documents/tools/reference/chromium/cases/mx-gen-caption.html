<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Generated text in a table caption at 10.5 pt: a ::before and an ::after on the caption, at the top and at the bottom. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } caption::before { content: "Table 1: "; } caption::after { content: " (end)"; } table { margin-bottom: 6pt; } .b { caption-side: bottom; }</style></head><body>
<table><caption>Caption</caption><tr><td id="one">one</td><td>two</td></tr></table>
<table class="b"><caption>Under</caption><tr><td id="three">three</td><td>four</td></tr></table>
</body></html>
