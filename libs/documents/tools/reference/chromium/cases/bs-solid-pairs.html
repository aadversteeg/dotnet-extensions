<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Solid borders of 6 px: top and right red beside bottom and left blue; four colours with a right side of width 0; four colours with a left side of style none. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { padding: 3pt; margin-bottom: 6pt; }</style></head><body>
<p>top</p>
<div id="pa" style="border:6px solid;border-color:#ff0000 #ff0000 #0000ff #0000ff">pa</div>
<div id="pz" style="border:6px solid;border-color:#ff0000 #008000 #0000ff #ffa500;border-right-width:0">pz</div>
<div id="pn" style="border:6px solid;border-color:#ff0000 #008000 #0000ff #ffa500;border-left-style:none">pn</div>
<p>end</p>
</body></html>
