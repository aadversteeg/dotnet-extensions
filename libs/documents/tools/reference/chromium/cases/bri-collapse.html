<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">

<p>Collapsed below.</p>
<table><tr><td class="bg">Filled</td><td>Plain</td></tr><tr><td>Other</td><td class="bg">Second</td></tr></table>
<p>End of table.</p>
</body></html>
