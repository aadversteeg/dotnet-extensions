<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- A background, padding and a border on a raised element and on a raised span, at 10.5 pt: the box moves with the shifted text; a whole and a fractional padding, a border alone and with padding, a sup at a line's start and a span raised by a length. -->
<style>@page { size: 300pt 300pt; margin: 12pt; } body { font-size: 10.5pt; } p { margin: 0 0 6pt 0; } .y { background-color: #ffd700; } .p { background-color: #ff8080; padding: 1.3pt 2pt; } .b { border: 0.75pt solid #0000ff; }</style></head><body>
<p>Word x<sup class="y">2</sup> y and m<sup class="y">high</sup> n</p>
<p>Pad x<sup class="p">2</sup> y and z<span class="p" style="vertical-align: super">up</span> w</p>
<p>Edge e<sup class="b">2</sup> f and g<sup class="b p">3</sup> h</p>
<p><sup class="y">Top</sup> line and a <span class="y" style="vertical-align: 3.1pt">lift</span> end</p>
</body></html>
