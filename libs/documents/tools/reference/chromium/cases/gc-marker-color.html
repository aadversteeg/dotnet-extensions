<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Bold.ttf); font-weight: 700; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Italic.ttf); font-weight: 400; font-style: italic; }
@page { size: 300pt 300pt; margin: 12pt; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
ul, ol { margin: 0 0 6pt; }
.r li::marker { color: #c00000; }
li.c::marker { color: #008000; }
ol.k > li::marker { color: #0000c0; }
ul.n { list-style: none; }
ul.n li::marker { color: #c00000; }
</style></head><body>
<ul class="r"><li>Disc</li><li style="list-style-type: circle">Circle</li><li style="list-style-type: square">Square</li></ul>
<ol class="r"><li>Decimal</li><li style="list-style-type: upper-roman">Roman</li><li style="list-style-type: lower-alpha">Alpha</li></ol>
<ul><li class="c">Class</li><li>Plain</li></ul>
<ol class="k"><li>Child</li><li class="c">Both</li></ol>
<ul class="n"><li>None</li></ul>
</body></html>
