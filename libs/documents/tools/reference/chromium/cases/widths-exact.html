<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- The cases of widths.html at 10.5pt = 14px: a font size Chromium keeps exact, so its text widths are the font's
     advances (see ../README.md, "Where Chromium is not exact"). The layout tests pin these numbers. -->
<style>body { font-size: 10.5pt; }</style></head><body>
<div id="w1" style="width:300pt"><table id="t1"><tr>
<td>alpha beta gamma delta epsilon</td><td>one two</td><td>a much longer piece of text that needs wrapping in the column</td>
</tr></table></div>
<div id="w2" style="width:400pt"><table id="t2"><colgroup><col style="width:100pt"><col><col></colgroup><tr>
<td>fixed</td><td>short</td><td>somewhat longer text</td>
</tr></table></div>
<div id="w3" style="width:300pt; display:grid; grid-template-columns: 1fr 2fr 1fr;">
<div>one</div><div>two words</div><div>Supercalifragilisticexpialidocious</div>
</div>
<div id="w4" style="width:300pt; display:grid; grid-template-columns: 2.5fr 3fr 10fr 2fr;">
<div>a</div><div>b</div><div>c</div><div>Duration</div>
</div>
</body></html>
