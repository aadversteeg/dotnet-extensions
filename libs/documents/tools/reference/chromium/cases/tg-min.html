<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Minimum and maximum heights on rows and cells: a, a row of min-height 40pt; b, a cell of min-height 40pt; c, a row of max-height 6pt; d, a cell of max-height 6pt. -->
<style>@page { size: 300pt 500pt; margin: 12pt; } body { font-size: 10.5pt; } .s { border-collapse: separate; border-spacing: 3pt; border: 1.5pt solid #ff0000; padding: 1.5pt; } td, th { border-color: #0000ff; }</style></head><body>
<table id="a">
<tr style="min-height: 40pt"><td id="one-a">one</td><td>two</td></tr>
</table>
<p>next 1</p>
<table id="b">
<tr><td id="one-b" style="min-height: 40pt">one</td><td>two</td></tr>
</table>
<p>next 2</p>
<table id="c">
<tr style="max-height: 6pt"><td id="one-c">one</td><td>two</td></tr>
</table>
<p>next 3</p>
<table id="d">
<tr><td id="one-d" style="max-height: 6pt">one</td><td>two</td></tr>
</table>
<p>after</p>
</body></html>
