<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Text that reaches into a large rounded corner: the content is not clipped by the radius. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } div { width: 150px; margin-bottom: 8px; }</style></head><body>
<p>top</p>
<div id="corner" style="border-radius:30px;background:#d0e8d0">corner text runs into the rounded corner of the box</div>
<div id="ring" style="border-radius:24px;border:2px solid #306030">ring text runs into the rounded corner of the box</div>
<p>end</p>
</body></html>
