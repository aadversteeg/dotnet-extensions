<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Dashed borders at places and sizes between pixels: widths of 1.5 px and 2.6 px, a box that starts between pixels and is a fraction of a pixel wide. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } div { height: 24px; margin-bottom: 8px; }</style></head><body>
<p>Fractional dashes.</p>
<div id="Half" style="width: 100px; border: 1.5px dashed #c03020">Half</div>
<div id="Wide" style="width: 100px; border: 2.6px dashed #2060a0">Wide</div>
<div id="Shifted" style="width: 100.3px; margin-left: 0.4pt; padding-top: 0.35pt; border: 1px dashed #208040">Shifted</div>
<div id="Moved" style="width: 77.6px; margin-left: 1.1pt; border: 3px dashed #806020">Moved</div>
</body></html>
