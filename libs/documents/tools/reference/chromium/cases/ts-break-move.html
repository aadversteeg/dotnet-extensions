<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Separated borders, a row of four lines that does not fit the rest of the page but fits a page. -->
<style>@page { size: 300pt 160pt; margin: 12pt; } body { font-size: 10.5pt; } table { border-collapse: separate; border-spacing: 6pt; border: 3pt solid #ff0000; padding: 3pt; background: #ffff00; } td, th { border-color: #0000ff; }</style></head><body>
<table id="t">
<tr><td id="one-cell">one</td><td>text 1</td></tr>
<tr><td id="two-cell">two</td><td>text 2</td></tr>
<tr><td id="three-cell">three</td><td>text 3</td></tr>
<tr><td id="tall-cell">tall<br>line 2<br>line 3<br>line 4</td><td id="beside-cell">beside</td></tr>
<tr><td id="five-cell">five</td><td>text 5</td></tr>
</table>
<p>after</p>
</body></html>
