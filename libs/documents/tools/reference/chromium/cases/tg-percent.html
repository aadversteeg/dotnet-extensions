<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Percent heights in a page without a container of a fixed height: a, a row of height 50%; b, a cell of height 50%; c, a table of height 50%. -->
<style>@page { size: 300pt 500pt; margin: 12pt; } body { font-size: 10.5pt; } .s { border-collapse: separate; border-spacing: 3pt; border: 1.5pt solid #ff0000; padding: 1.5pt; } td, th { border-color: #0000ff; }</style></head><body>
<table id="a">
<tr style="height: 50%"><td id="one-a">one</td><td>two</td></tr>
</table>
<p>next 1</p>
<table id="b">
<tr><td id="one-b" style="height: 50%">one</td><td>two</td></tr>
</table>
<p>next 2</p>
<table id="c" style="height: 50%">
<tr><td id="one-c">one</td><td>two</td></tr>
</table>
<p>after</p>
</body></html>
