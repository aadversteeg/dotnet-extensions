<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- A paragraph whose bottom padding does not fit below its line, inside two bordered boxes: the paragraph breaks before
     its bottom padding, and both boxes around it end right below their content on the first page, not at the page end. -->
<style>@page { size: 300pt 60pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; orphans: 1; widows: 1; }</style></head><body>
<div style="border:1.5pt solid #ff0000"><div style="border:1.5pt solid #0000ff"><p style="padding-bottom:30pt">a</p></div></div><p>after</p>
</body></html>
