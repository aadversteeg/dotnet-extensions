<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: "Times New Roman"; src: url(../../../../assets/fonts/theano/TheanoDidot-Regular.ttf); font-weight: 400; font-style: normal; }
@font-face { font-family: Lato; src: url(../../../../assets/fonts/lato/Lato-Regular.ttf); font-weight: 400; }
html, body { margin: 0; padding: 0; }
body { font-family: Lato; font-size: 10.5pt; line-height: normal; }
p { margin: 0; }
@page { size: 300pt 300pt; margin: 12pt; }
table { border-collapse: collapse; }
td { border: 0.75pt solid #000000; padding: 2.3pt 4pt; }
ul { margin: 0; padding-left: 18pt; }
.k { display: inline-block; padding: 0 3pt; background-color: #c0ffc0; }
</style></head><body>
<!-- An inline-block in a table cell and in a list item, and text-transform, letter-spacing and the initial font family inherited into it. -->
<table><tr><td>Cell <span class="k">Inside</span> text</td><td>Other</td></tr></table>
<ul><li>Item <span class="k">Listed</span> text</li></ul>
<p style="text-transform: uppercase">Upper <span class="k">case</span> text</p>
<p style="letter-spacing: 0.37pt">Spaced <span class="k">Letters</span> text</p>
<p style="font-family: initial">Serif <span class="k">Family</span> text</p>
<p>Last line of text.</p>
</body></html>
