<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Rounded list items with a background, one with a 1 px border; the markers stay outside. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } ul { margin: 0 0 6pt 0; padding-left: 24px; } li { background: #f0e0a0; border-radius: 6px; padding: 2px 6px; margin-bottom: 4px; } .one { border: 1px solid #c03020; }</style></head><body>
<p>List below.</p>
<ul><li>First item</li><li class="one">Second item</li><li style="border-radius:999px">Third item</li></ul>
<p>End of list.</p>
</body></html>
