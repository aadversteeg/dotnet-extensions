<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<!-- Rounded inline boxes on lines that start between pixels: the paragraphs have margins and padding in fractions of a pixel, so the boxes are put on whole pixels of the page. -->
<style>@page { size: 300pt 400pt; margin: 12pt; } body { font-size: 10.5pt; line-height: 15pt; } p { margin: 0 0 6pt 0; } .bg { background: #f0e0a0; } .pill { border-radius: 999px; padding: 2px 6px; } .one { border: 1px solid #c03020; } .r { border-radius: 5px; padding: 1.5pt 4pt; }</style></head><body>
<p>First line above.</p>
<p style="margin-left:0.4pt; padding-top:0.35pt">Shifted <span class="bg pill">pill</span> and <span class="bg r one">ring</span> end.</p>
<p style="margin-left:1.1pt; padding-top:0.2pt">Moved <span class="bg r">badge</span> and <span class="bg pill one">pill</span> end.</p>
<p style="margin-left:0.7pt; padding-top:0.45pt">Third <span class="bg r">rounded</span> and <span class="bg pill">pill</span> end.</p>
</body></html>
