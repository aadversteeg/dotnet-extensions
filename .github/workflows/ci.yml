name: CI

# Builds and tests the families a change touches, on Linux and Windows, against the net10.0 build and the
# netstandard2.0 build of the libraries, and on Windows also on .NET Framework 4.8 against the netstandard2.0 build.
# When the file-system family is affected, its tests also run against the netstandard2.1 build of the two libraries
# that have one. The documents family targets net10.0 only and has a job of its own. On main it also builds and
# tests every package the way a release does, and runs the Azure integration tests against a real storage account.
# The last job, CI result, is the one status check that a pull request needs.
# Nothing here publishes anything. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Seconds dotnet test waits for a test host to start; the default of 90 is too short on a busy runner.
  VSTEST_CONNECTION_TIMEOUT: 300

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Find the affected families
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of a pull request through the API
    outputs:
      solutions: ${{ steps.affected.outputs.solutions }}
      file-system: ${{ steps.affected.outputs.file-system }}
      documents: ${{ steps.affected.outputs.documents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            root:
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'
              - 'dotnet-extensions.slnx'
              - 'eng/**'
              - '.github/workflows/ci.yml'
            functional:
              - 'libs/functional/**'
            error-paths:
              - 'libs/error-paths/**'
            fluent-contracts:
              - 'libs/fluent-contracts/**'
            file-system:
              - 'libs/file-system/**'
            documents:
              - 'libs/documents/**'

      - id: affected
        name: Choose the solutions to build
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          # A family is built and tested when it changed or a family below it changed. The order is
          # functional <- error-paths <- fluent-contracts, file-system and documents (file-system and documents use
          # both lower families). So a change at the root (build files, eng/, this workflow), in functional or in
          # error-paths builds every family; fluent-contracts, file-system and documents only build themselves.
          # The jobs test and test-net48 get the family solutions except documents, which targets net10.0 only and
          # runs in the job test-documents; the root solution dotnet-extensions.slnx holds the same projects as all
          # family solutions together.
          has() { [[ "$CHANGES" == *"\"$1\""* ]]; }
          all=false
          if [ "$EVENT" = workflow_dispatch ] || has root || has functional || has error-paths; then all=true; fi
          solutions=""
          for family in functional error-paths fluent-contracts file-system; do
            if [ "$all" = true ] || has "$family"; then solutions="$solutions libs/$family/extensions.slnx"; fi
          done
          solutions="${solutions# }"
          # file-system=true: the job test-netstandard21 runs. documents=true: the job test-documents runs.
          file_system=false
          if [ "$all" = true ] || has file-system; then file_system=true; fi
          documents=false
          if [ "$all" = true ] || has documents; then documents=true; fi
          echo "Changed: $CHANGES"
          echo "Solutions: ${solutions:-none}"
          echo "File-system family affected: $file_system"
          echo "Documents family affected: $documents"
          {
            echo "solutions=$solutions"
            echo "file-system=$file_system"
            echo "documents=$documents"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.asset }})
    needs: changes
    if: needs.changes.outputs.solutions != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # net10.0: the tests run against the net10.0 build of the libraries.
        # netstandard2.0: the same tests against the netstandard2.0 build (-p:UseNs20=true, see README.md).
        asset: [net10.0, netstandard2.0]
    runs-on: ${{ matrix.os }}
    env:
      SOLUTIONS: ${{ needs.changes.outputs.solutions }}
      USE_NS20: ${{ matrix.asset == 'netstandard2.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: |
          for solution in $SOLUTIONS; do
            dotnet build "$solution" -c Release -p:UseNs20="$USE_NS20"
          done

      - name: Test
        # Category=Network is left out: those Azure unit tests call the Azure SDK against a storage account host
        # name that does not exist and wait for its retries (about two minutes), and on a runner where the name
        # resolves they would reach the real Azure endpoint. See libs/file-system/README.md.
        run: |
          status=0
          for solution in $SOLUTIONS; do
            dotnet test "$solution" -c Release --no-build -p:UseNs20="$USE_NS20" --filter "Category!=Network" \
              --logger trx --results-directory "$RUNNER_TEMP/test-results" || status=1
          done
          exit $status

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.asset }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  test-net48:
    # The same tests as the job test, on .NET Framework 4.8 against the netstandard2.0 build of the libraries
    # (-p:UseNet48=true, see README.md): what an application on .NET Framework gets. Windows only.
    # UnitTests.Extensions.ErrorPaths.AspNetCore stays on net10.0, because its library has no netstandard2.0 build.
    name: Test (windows-latest, .NET Framework 4.8)
    needs: changes
    if: needs.changes.outputs.solutions != ''
    runs-on: windows-latest
    env:
      SOLUTIONS: ${{ needs.changes.outputs.solutions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: |
          for solution in $SOLUTIONS; do
            dotnet build "$solution" -c Release -p:UseNet48=true
          done

      - name: Test
        # Category=Network is left out, as in the job test.
        run: |
          status=0
          for solution in $SOLUTIONS; do
            dotnet test "$solution" -c Release --no-build -p:UseNet48=true --filter "Category!=Network" \
              --logger trx --results-directory "$RUNNER_TEMP/test-results" || status=1
          done
          exit $status

      - name: List the skipped tests
        # Shows on the run page which tests skipped themselves on this runner.
        if: always()
        run: |
          skipped=$(cat "$RUNNER_TEMP"/test-results/*.trx 2>/dev/null \
            | grep -o '<UnitTestResult [^>]*outcome="NotExecuted"[^>]*>' \
            | sed -E 's/.* testName="([^"]*)".*/\1/' | sort -u | awk '{ printf "%s%s", (NR > 1 ? ", " : ""), $0 }' \
            || true)
          echo "::notice title=Skipped tests (.NET Framework 4.8)::${skipped:-no tests skipped}"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-latest-net48
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  test-netstandard21:
    # The file-system tests against the netstandard2.1 build of Ave.Extensions.FileSystem.InMemory and
    # Ave.Extensions.FileSystem.AzureFileStorage, on the netstandard2.0 build of the other libraries: what an
    # application on .NET Core 3.0 up to .NET 9 gets (-p:UseNs21=true, see README.md). Only the file-system family
    # has a netstandard2.1 build; for the other families this run would repeat the netstandard2.0 run.
    name: Test (${{ matrix.os }}, netstandard2.1, file-system)
    needs: changes
    if: needs.changes.outputs.file-system == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOLUTION: libs/file-system/extensions.slnx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$SOLUTION" -c Release -p:UseNs21=true

      - name: Test
        # Category=Network is left out, as in the job test.
        run: |
          dotnet test "$SOLUTION" -c Release --no-build -p:UseNs21=true --filter "Category!=Network" \
            --logger trx --results-directory "$RUNNER_TEMP/test-results"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-netstandard2.1
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  test-documents:
    # The documents family targets net10.0 only, so it has no netstandard2.0 run. Its reference tests (veraPDF,
    # qpdf and the other tools in pinned Docker images, trait Category=Reference) run where the runner's Docker runs
    # Linux containers (ubuntu-latest); on windows-latest they are skipped with a message that says so.
    name: Test (${{ matrix.os }}, net10.0, documents)
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SOLUTION: libs/documents/extensions.slnx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$SOLUTION" -c Release

      - name: Test
        run: |
          dotnet test "$SOLUTION" -c Release --no-build --logger trx --results-directory "$RUNNER_TEMP/test-results"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-documents
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  test-documents-arm64:
    # The documents family on arm64 Linux: the proof that its output does not depend on the processor. The golden PNG
    # files, the pinned pixel hash of the Graphics scene and the pinned PNG bytes must come out the same as on x64.
    # The Docker reference tests (trait Category=Reference) are left out: their images are built for x64.
    # The JPEG conformance tests (trait Category=Network) need no Docker and run here too.
    name: Test (ubuntu-24.04-arm, net10.0, documents)
    needs: changes
    if: needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      SOLUTION: libs/documents/extensions.slnx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$SOLUTION" -c Release

      - name: Test
        run: |
          dotnet test "$SOLUTION" -c Release --no-build --filter "Category!=Reference" --logger trx --results-directory "$RUNNER_TEMP/test-results"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-ubuntu-24.04-arm-documents
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  azure-integration:
    # The integration tests of Ave.Extensions.FileSystem.AzureFileStorage against a real Azure storage account, in
    # the three test modes. In every other job these tests skip themselves, because no storage account is
    # configured there. Only on main: a pull request never gets the account key. The tests empty the file share
    # they use, so the three modes run one after the other (max-parallel: 1) and on Linux only; the concurrency
    # group of this workflow keeps two runs on main apart. The test results are not kept as an artifact: secrets
    # are masked in the log, not in a file.
    name: Azure integration tests (${{ matrix.asset }}, main only)
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.file-system == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        asset: [net10.0, netstandard2.0, netstandard2.1]
    runs-on: ubuntu-latest
    env:
      PROJECT: libs/file-system/integration-tests/IntegrationTests.AzureFileStorage/IntegrationTests.AzureFileStorage.csproj
      USE_NS20: ${{ matrix.asset == 'netstandard2.0' }}
      USE_NS21: ${{ matrix.asset == 'netstandard2.1' }}
    steps:
      - name: The storage account secrets are set
        env:
          ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          if [ -z "$ACCOUNT_NAME" ] || [ -z "$ACCOUNT_KEY" ]; then
            echo "::error title=Azure integration tests::The repository secrets AZURE_STORAGE_ACCOUNT_NAME and AZURE_STORAGE_ACCOUNT_KEY are not set. See libs/file-system/README.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build "$PROJECT" -c Release -p:UseNs20="$USE_NS20" -p:UseNs21="$USE_NS21"

      - name: Test
        # The share name and the other settings come from appsettings.test.json in the test project.
        env:
          AZURE_FILESTORAGE_AzureFileStorage__AccountName: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_FILESTORAGE_AzureFileStorage__AccountKey: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        run: |
          dotnet test "$PROJECT" -c Release --no-build -p:UseNs20="$USE_NS20" -p:UseNs21="$USE_NS21" \
            --logger "trx;LogFileName=azure-integration.trx" --results-directory "$RUNNER_TEMP/test-results"

      - name: Every test ran
        # A test that cannot use the storage account skips itself, and a skipped test proves nothing.
        run: |
          counters=$(grep -o '<Counters [^>]*>' "$RUNNER_TEMP/test-results/azure-integration.trx")
          total=$(sed -E 's/.* total="([0-9]+)".*/\1/' <<< "$counters")
          executed=$(sed -E 's/.* executed="([0-9]+)".*/\1/' <<< "$counters")
          echo "Tests: $total, executed: $executed"
          if [ "$total" -eq 0 ] || [ "$executed" -ne "$total" ]; then
            echo "::error title=Azure integration tests::$((total - executed)) of $total tests did not run"
            exit 1
          fi

  checks:
    name: Repository checks
    needs: changes
    if: needs.changes.outputs.solutions != '' || needs.changes.outputs.documents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Release tag names are unique
        run: dotnet msbuild eng/release-tags.proj -nologo

      - name: Build
        run: dotnet build dotnet-extensions.slnx -c Release

      - name: netstandard2.0 builds reference only what their dependencies guarantee
        run: dotnet run --project eng/Ns20ReferenceCheck -c Release -- --configuration Release

  release-mode:
    # Builds and tests every package the way release.yml does: against the published minimum versions of our
    # own packages (UseRepoProjectReferences=false). Shows on main what a release would run into; it is not a
    # pull request check, because a change that raises a minimum is only releasable after the lower package
    # is published.
    name: Release mode (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build every library against the published minimum versions
        run: |
          status=0
          for project in libs/*/Ave.Extensions.*/Ave.Extensions.*.csproj; do
            echo "::group::$project"
            if ! dotnet build "$project" -c Release -p:UseRepoProjectReferences=false; then
              status=1
              echo "::error title=Release mode::$project does not build against the published minimum versions"
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Test every package against the published minimum versions
        if: success() || failure()
        run: |
          dotnet msbuild eng/release-tags.proj -nologo -t:ListTests -p:OutputFile="$RUNNER_TEMP/tests.txt"
          status=0
          while read -r project package head_mode; do
            if [ "$head_mode" = true ]; then
              echo "$project ($package): TestInHeadMode, a release runs it in head mode; skipped here"
              continue
            fi
            echo "::group::$project ($package)"
            if ! dotnet test "$project" -c Release -p:UseRepoProjectReferences=false --filter "Category!=Network"; then
              status=1
              echo "::error title=Release mode::$project fails against the published minimum versions"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/tests.txt"
          exit $status

  result:
    # The one status check that the ruleset on main requires (see docs/RELEASING.md, "Rulesets"). The jobs above
    # cannot be required themselves: most of them are skipped when their family is not affected and they report
    # per matrix combination, so no fixed list of check names fits every pull request, and a required check that
    # never reports blocks the pull request. This job always runs, also when a job before it failed or the run was
    # cancelled, and fails unless every pull request job succeeded or was skipped. The two jobs that run on main
    # only are not part of it.
    name: CI result
    needs: [changes, test, test-net48, test-netstandard21, test-documents, test-documents-arm64, checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          # changes decides which jobs run: when it did not succeed, the other jobs are skipped for the wrong reason
          failed=$(jq -r '[to_entries[]
            | select(.value.result != "success" and (.value.result != "skipped" or .key == "changes"))
            | "\(.key) (\(.value.result))"] | join(", ")' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error title=CI result::Not succeeded: $failed"
            exit 1
          fi
